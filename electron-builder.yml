# Installers for macOS (DMG and ZIP, universal), Windows (NSIS .exe, and MSIX for the Microsoft Store) and Linux
# (AppImage and .deb), as in the Slides and Graph Editors. Locally: npm run package (tools/package.mjs) builds this
# system's installers into release/. Releases: .github/workflows/release.yml, from a tag vX.Y.Z.
appId: org.edukors.text
productName: Edukors Text Editor
copyright: Copyright © 2026 Edukors
directories:
  output: release
  buildResources: build
files:
  - package.json
  - index.html
  - app-config.js
  - document.js
  - assistant.js
  - dist/editor.js
  - dist/editor.css
  - dist/pdfjs/**
  - desktop/**
  # Edukors Common (node_modules/edukors-common-ux) and its dependencies come in as production dependencies. The AI
  # runtime runs the CLI the person installed (Claude Code, Codex), not the copy bundled in the SDK (~220 MB).
  - "!node_modules/@anthropic-ai/claude-agent-sdk-*/**"
  - "!**/*.d.ts"
asar: true
npmRebuild: false
afterPack: build/after-pack.cjs
fileAssociations:
  - ext: etex
    name: Edukors Text Document
    mimeType: application/vnd.edukors.text+zip
    role: Editor
publish:
  provider: github
  owner: mgarlabx
  repo: edukors_text_editor

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  artifactName: Edukors-Text-Editor-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  artifactName: Edukors-Text-Editor-${version}-mac-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64]
    - target: appx
      arch: [x64]
  artifactName: Edukors-Text-Editor-${version}-setup.${ext}
# Microsoft Store package (MSIX; electron-builder calls the target "appx"), which the Store signs. The publisher is the
# Edukors Partner Center account's (the same as the Slides and Graph Editors'); identityName must be the one Partner
# Center shows in Product management → Product identity once "Edukors Text Editor" is reserved (check it then).
appx:
  identityName: mgarlabx.EdukorsTextEditor
  publisher: CN=25CB0A95-E013-4D6C-9667-81DF1CC50F46
  publisherDisplayName: mgarlabx
  displayName: Edukors Text Editor
  applicationId: EdukorsTextEditor
  backgroundColor: transparent
  languages: [en-US, pt-BR, es-ES]
  # The Store takes MSIX packages only for Windows above 10.0.17134 (1803); Electron needs Windows 10 anyway.
  minVersion: 10.0.17763.0
  maxVersionTested: 10.0.26100.0
  artifactName: Edukors-Text-Editor-${version}-${arch}.${ext}
nsis:
  oneClick: true
  perMachine: false

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office
  executableName: edukors-text-editor
  synopsis: Text editor of the Edukors apps
  maintainer: Edukors
  artifactName: Edukors-Text-Editor-${version}-linux-${arch}.${ext}
