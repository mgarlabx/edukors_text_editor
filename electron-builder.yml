# Installers: DMG (macOS, universal), MSIX (Windows), AppImage (Linux). Locally: npm run package (tools/package.mjs)
# builds this system's installer into release/. Releases: .github/workflows/release.yml, from a tag vX.Y.Z.
appId: org.edukors.text
productName: Edukors Text Editor
copyright: Copyright © 2026 Edukors
directories:
  output: release
  buildResources: build
files:
  - package.json
  - index.html
  - app-config.js
  - document.js
  - assistant.js
  - dist/editor.js
  - dist/editor.css
  - dist/pdfjs/**
  - desktop/**
  # Edukors Common (node_modules/edukors-common-ux) and its dependencies come in as production dependencies. The AI
  # runtime runs the CLI the person installed (Claude Code, Codex), not the copy bundled in the SDK (~220 MB).
  - "!node_modules/@anthropic-ai/claude-agent-sdk-*/**"
  - "!**/*.d.ts"
asar: true
npmRebuild: false
afterPack: build/after-pack.cjs
fileAssociations:
  - ext: etex
    name: Edukors Text Document
    mimeType: application/vnd.edukors.text+zip
    role: Editor
publish:
  provider: github
  owner: mgarlabx
  repo: edukors_text_editor

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [universal]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  artifactName: Edukors-Text-Editor-${version}-mac.${ext}

win:
  target:
    - target: appx
      arch: [x64]
# MSIX for the Microsoft Store (electron-builder calls the target "appx"). Replace the identity with the one from
# Partner Center → Product identity once the app is reserved there; the Store signs and updates the package.
appx:
  identityName: Edukors.EdukorsTextEditor
  publisher: CN=Edukors
  publisherDisplayName: Edukors
  displayName: Edukors Text Editor
  applicationId: EdukorsTextEditor
  backgroundColor: transparent
  languages: [en-US, pt-BR, es-ES, zh-CN, hi-IN]
  minVersion: 10.0.17763.0
  maxVersionTested: 10.0.26100.0
  artifactName: Edukors-Text-Editor-${version}-windows-${arch}.msix

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Office
  executableName: edukors-text-editor
  synopsis: Text editor of the Edukors apps
  maintainer: Edukors
  artifactName: Edukors-Text-Editor-${version}-linux-${arch}.${ext}
